name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -c "from md2tex.converter import parse, _render_block; t,f=parse('# Hola'); assert 'section' in _render_block(t,{},f); print('Tests OK')"
      - name: Build binaries
        run: python build.py binaries
      - name: Build .deb installer
        run: python build.py installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/md2tex_*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -c "from md2tex.converter import parse, _render_block; t,f=parse('# Hola'); assert 'section' in _render_block(t,{},f); print('Tests OK')"
      - name: Code sign (optional)
        if: ${{ env.APPLE_DEVELOPER_ID != '' }}
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          echo "Code signing not configured — skipping"
      - name: Build binaries + .dmg
        run: python build.py all
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/md2tex-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -c "from md2tex.converter import parse, _render_block; t,f=parse('# Hola'); assert 'section' in _render_block(t,{},f); print('Tests OK')"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Build binaries
        run: python build.py binaries
      - name: Build .exe installer
        run: python build.py installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/md2tex-setup-v*.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          merge-multiple: true
      - name: List installers
        run: ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.dmg
            *.exe
          generate_release_notes: true
