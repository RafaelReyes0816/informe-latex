name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          - os: macos-latest
            name: macos
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build GUI binary
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile \
            --name md2tex-${{ matrix.name }} \
            --add-data "templates${SEP}templates" \
            --noconsole \
            md2tex/__main__.py

      - name: Build CLI binary
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile \
            --name md2tex-${{ matrix.name }}-cli \
            --add-data "templates${SEP}templates" \
            md2tex/__main__.py

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2tex-${{ matrix.name }}
          path: dist/md2tex-${{ matrix.name }}${{ matrix.ext }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: md2tex-${{ matrix.name }}-cli
          path: dist/md2tex-${{ matrix.name }}-cli${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: md2tex-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            md2tex-linux
            md2tex-linux-cli
            md2tex-windows.exe
            md2tex-windows-cli.exe
            md2tex-macos
            md2tex-macos-cli
          generate_release_notes: true
